name: Daily Costume Culture Update
on:
  schedule:
    - cron: '20 0 * * *' # 08:20 Beijing time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch public fashion and costume news
        run: python update_news.py
      - name: Commit daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Daily costume culture update"
          git push
